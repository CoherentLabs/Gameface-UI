<text x="380.0" y="266" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">hide: coming back is instant and keeps state, but memory grows with what was seen.</text>
<text x="380.0" y="284" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">dispose: memory stays small, content is created again when it comes back.</text>

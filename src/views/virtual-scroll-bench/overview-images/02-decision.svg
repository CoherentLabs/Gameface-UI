<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
  <marker id="arrowGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="519" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="450.0" y="34" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">Which one should I use?</text>
<rect x="320" y="62" width="260" height="46" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/><text x="450.0" y="90" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">More than ~100 items?</text>
<line x1="320" y1="85" x2="160" y2="85" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="78" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">no</text>
<rect x="30" y="56" width="130" height="58" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/><text x="95.0" y="80" font-size="15" fill="#57606a" text-anchor="middle" font-weight="bold">Normal Scroll</text><text x="95.0" y="100" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">simplest</text>
<line x1="450" y1="108" x2="450" y2="150" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="458.0" y="133.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">yes</text>
<rect x="300" y="150" width="300" height="46" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/><text x="450.0" y="178" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Are all items the same size?</text>
<line x1="350" y1="196" x2="200" y2="250" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="240" y="222" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">yes</text>
<line x1="550" y1="196" x2="700" y2="250" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="640" y="222" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">no</text>
<rect x="80" y="250" width="240" height="58" rx="10" fill="#dff3e4" stroke="#2e8b57" stroke-width="2"/><text x="200.0" y="274" font-size="15" fill="#2e8b57" text-anchor="middle" font-weight="bold">VirtualScroll</text><text x="200.0" y="294" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">fastest, any length</text>
<line x1="200" y1="308" x2="200" y2="334" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="334" width="280" height="60" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/><text x="200.0" y="362" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Do items have their own state?</text><text x="200.0" y="381" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">checkboxes, inputs, open panels</text>
<line x1="120" y1="394" x2="90" y2="430" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="64" y="418" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">no</text>
<line x1="280" y1="394" x2="310" y2="430" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="302" y="418" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">yes</text>
<rect x="20" y="430" width="140" height="58" rx="10" fill="#dff3e4" stroke="#2e8b57" stroke-width="2"/><text x="90.0" y="454" font-size="15" fill="#2e8b57" text-anchor="middle" font-weight="bold">recycle</text><text x="90.0" y="474" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">the default</text>
<rect x="240" y="430" width="140" height="58" rx="10" fill="#dff3e4" stroke="#2e8b57" stroke-width="2"/><text x="310.0" y="454" font-size="15" fill="#2e8b57" text-anchor="middle" font-weight="bold">unmount</text><text x="310.0" y="474" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">safe for any item</text>
<text x="200" y="506" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" font-style="italic">short feed read top to bottom → append</text>
<rect x="580" y="250" width="240" height="58" rx="10" fill="#efe5ff" stroke="#8250df" stroke-width="2"/><text x="700.0" y="274" font-size="15" fill="#8250df" text-anchor="middle" font-weight="bold">LazyScroll</text><text x="700.0" y="294" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">any heights · experiment</text>
<line x1="700" y1="308" x2="700" y2="334" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560" y="334" width="280" height="60" rx="10" fill="#f6f8fa" stroke="#656d76" stroke-width="1.5"/><text x="700.0" y="362" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">Keep state / instant return?</text><text x="700.0" y="381" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">and the list is not huge</text>
<line x1="620" y1="394" x2="590" y2="430" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="556" y="418" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">yes</text>
<line x1="780" y1="394" x2="810" y2="430" stroke="#656d76" stroke-width="1.8" marker-end="url(#arrow)"/><text x="802" y="418" font-size="12" fill="#656d76" text-anchor="start" font-weight="bold">no</text>
<rect x="520" y="430" width="140" height="58" rx="10" fill="#efe5ff" stroke="#8250df" stroke-width="2"/><text x="590.0" y="454" font-size="15" fill="#8250df" text-anchor="middle" font-weight="bold">hide</text><text x="590.0" y="474" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">keeps content</text>
<rect x="740" y="430" width="140" height="58" rx="10" fill="#efe5ff" stroke="#8250df" stroke-width="2"/><text x="810.0" y="454" font-size="15" fill="#8250df" text-anchor="middle" font-weight="bold">dispose</text><text x="810.0" y="474" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">smallest memory</text>
</svg>

<text x="390.0" y="368" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Nothing is created or destroyed - only the text, images and position of row A change.</text>
<text x="390.0" y="388" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">Row r is always drawn by pool row (r mod pool size), so one row crossed = one pool row updated.</text>
<text x="390.0" y="406" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" font-style="italic">Moving uses transform only - Gameface skips the layout solve for it.</text>

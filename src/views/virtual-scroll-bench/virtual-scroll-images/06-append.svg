<text x="390.0" y="466" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal">Scrolling back up is free - those rows are still there.</text>
<text x="390.0" y="486" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal" font-style="italic">But memory and the per-frame cost grow with every batch, and a far jump builds every batch up to it.</text>

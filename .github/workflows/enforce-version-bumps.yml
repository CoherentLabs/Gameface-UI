name: enforce-version-bumps
on:
  pull_request:
    branches: [master]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history + the base branch to diff against

      - name: List changed files
        run: |
          echo "PR base branch : ${{ github.base_ref }}"
          echo "----- changed files -----"
          git diff --name-only origin/${{ github.base_ref }}...HEAD
          echo "-------------------------"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Regenerate registry
        run: node scripts/registry/generate-registry.mts
      - name: Check version bumps
        run: node scripts/registry/check-version-bumps.mts
        env:
          BASE_REF: ${{ github.base_ref }}